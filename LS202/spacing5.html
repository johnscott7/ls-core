<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    div {
      height: 300px;
      width: 300px;
    }
    #red {
      background-color: #fcc;
      padding: 20px;
      box-sizing: border-box;
      display: inline-block;
    }
    #blue {
      background-color: #ccf;
      border: 5px solid black;
      box-sizing: border-box;
      display: inline-block;
      margin-left: 20px;
    }
  </style>
</head>
<body>
  <div id="red"></div>
  <div id="blue"></div>
</body>
</html>
