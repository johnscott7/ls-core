<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Getting to Know the User</title>
  <style>
    fieldset {
      width: fit-content;
    }
  </style>
</head>
<body>
  <form action="#">
    <h1>Getting to Know You</h1>
    <dl class="partial one_half left">
      <label for="first-Name">First Name:</label>
      <input type="text" id="first-Name" name="user_first_name">
    </dl><!--
    --><dl class="partial one_half right"><label for="last-Name">Last Name:</label>
      <input type="text" id="last-Name" name="user_last_name">
    </dl>
    <label for="email">Email:</label>
    <input type="email" id="email" name="user_email"
      placeholder="dontsendit@wontreadit.com">
    <label for="city">City:</label>
    <input type="text" id="city" name="user_city">
    <label for="state">State:</label>
    <select id="state" name="state">
      <option>AK</option>
      <option>AL</option>
      <option>AR</option>
      <option>AZ</option>
      <option>CA</option>
      <option>CO</option>
      <option>CT</option>
      <option>DC</option>
      <option>DE</option>
      <option>FL</option>
      <option>GA</option>
      <option>HI</option>
      <option>IA</option>
      <option>ID</option>
      <option>IL</option>
      <option>IN</option>
      <option>KS</option>
      <option>KY</option>
      <option>LA</option>
      <option>MA</option>
      <option>MD</option>
      <option>ME</option>
      <option>MI</option>
      <option>MN</option>
      <option>MO</option>
      <option>MS</option>
      <option>MT</option>
      <option>NC</option>
      <option>ND</option>
      <option>NE</option>
      <option>NH</option>
      <option>NJ</option>
      <option>NM</option>
      <option>NV</option>
      <option>NY</option>
      <option>OH</option>
      <option>OK</option>
      <option>OR</option>
      <option>PA</option>
      <option>RI</option>
      <option>SC</option>
      <option>SD</option>
      <option>TN</option>
      <option>TX</option>
      <option>UT</option>
      <option>VA</option>
      <option>VT</option>
      <option>WA</option>
      <option>WI</option>
      <option>WV</option>
      <option>WY</option>
    </select>
    <label for="zipcode">Zip Code:</label>
    <input type="text" id="zipcode" name="user_zip"
      placeholder="12345" maxlength="5" pattern="[0-9]{5}" required>
    <fieldset>
      <legend>Which of these colors do you like best?</legend>
        <label>
          <input type="radio" name="color" value="red-green" checked>
          Red-Green
        </label>
        <label>
          <input type="radio" name="color" value="green-red">
          Green-Red
        </label>
        <label>
          <input type="radio" name="color" value="green-blue">
          Green-Blue
        </label>
        <label>
          <input type="radio" name="color" value="blue-green">
          Blue-Green
        </label>
    </fieldset>
    <fieldset>
      <legend>Which technologies do you want to learn?</legend>
        <label>
          <input type="checkbox" name="tech" value="HTML">
          HTML
        </label>
        <label>
          <input type="checkbox" name="tech" value="Golang">
          Golang
        </label>
        <label>
          <input type="checkbox" name="tech" value="Python">
          Python
        </label>
        <label>
          <input type="checkbox" name="tech" value="Ruby">
          Ruby
        </label>
      </fieldset>
        <label>
          Leave a comment:
          <textarea name="feedback" rows="6" cols="80"></textarea>
        </label>
        <input type="hidden" name="submission_date" value="2026-10-31">
        <button type="submit">Send</button>
        <button type="reset">Clear Form</button>
  </form>

</body>
</html>
